<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarity — Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;1,300&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg1: #1a0533;
  --bg2: #0f2952;
  --accent: #c8f04a;
  --accent-dark: #9abe2e;
  --card: rgba(255,255,255,0.07);
  --card-border: rgba(255,255,255,0.10);
  --card-done: rgba(255,255,255,0.03);
  --text: #f0edf7;
  --text-dim: rgba(240,237,247,0.45);
  --text-done: rgba(240,237,247,0.30);
  --radius: 16px;
}

html, body { min-height: 100%; }

body {
  font-family: 'Instrument Sans', sans-serif;
  background: linear-gradient(145deg, var(--bg1) 0%, var(--bg2) 100%);
  min-height: 100vh;
  color: var(--text);
  padding-bottom: 4rem;
  position: relative;
  overflow-x: hidden;
}

/* Ambient blobs */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
  z-index: 0;
}
body::before {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(200,240,74,0.12), transparent 70%);
  top: -100px; right: -100px;
}
body::after {
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(120,80,200,0.18), transparent 70%);
  bottom: -80px; left: -80px;
}

.app {
  position: relative; z-index: 1;
  max-width: 560px;
  margin: 0 auto;
  padding: 3rem 1.25rem 2rem;
}

/* Header */
.header { margin-bottom: 2.5rem; }

.logo {
  font-family: 'Fraunces', serif;
  font-size: 2.4rem;
  font-weight: 300;
  letter-spacing: -0.02em;
  line-height: 1;
}
.logo em { font-style: italic; color: var(--accent); }

.tagline {
  font-size: 0.8rem;
  color: var(--text-dim);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 4px;
}

/* Progress */
.progress-wrap {
  margin-top: 1.25rem;
  display: flex;
  align-items: center;
  gap: 12px;
}

.progress-bar-track {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.10);
  border-radius: 2px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  width: 0%;
  transition: width .5s cubic-bezier(.4,0,.2,1);
}

.progress-label {
  font-size: 0.78rem;
  color: var(--text-dim);
  white-space: nowrap;
}

/* Add task */
.add-row {
  display: flex;
  gap: 10px;
  margin-bottom: 2rem;
}

.add-input {
  flex: 1;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 50px;
  padding: 0.75rem 1.3rem;
  font-family: 'Instrument Sans', sans-serif;
  font-size: 0.92rem;
  color: var(--text);
  outline: none;
  transition: border-color .2s, background .2s;
}
.add-input::placeholder { color: rgba(255,255,255,0.30); }
.add-input:focus {
  border-color: rgba(200,240,74,0.5);
  background: rgba(255,255,255,0.11);
}

.add-btn {
  width: 46px; height: 46px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .2s, transform .12s;
}
.add-btn:hover { background: #d8ff5a; }
.add-btn:active { transform: scale(0.93); }
.add-btn svg { width: 20px; height: 20px; stroke: #0f2952; stroke-width: 2.5; }

/* Filters */
.filters {
  display: flex;
  gap: 8px;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 6px 16px;
  border-radius: 50px;
  border: 1px solid rgba(255,255,255,0.12);
  background: transparent;
  color: var(--text-dim);
  font-family: 'Instrument Sans', sans-serif;
  font-size: 0.78rem;
  letter-spacing: 0.03em;
  cursor: pointer;
  transition: all .18s;
}
.filter-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #0f2952;
  font-weight: 500;
}

/* Section headers */
.section-head {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-bottom: 10px;
  margin-top: 0.5rem;
  padding-left: 4px;
}

/* Task list */
.task-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  list-style: none;
}

/* Task card */
.task-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  transition: background .2s, border-color .2s, opacity .3s, transform .3s;
  animation: slideIn .28s cubic-bezier(.4,0,.2,1) both;
  position: relative;
  overflow: hidden;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.task-card.done {
  background: var(--card-done);
  border-color: rgba(255,255,255,0.05);
}

.task-card.removing {
  opacity: 0;
  transform: translateX(30px) scale(0.97);
  transition: opacity .25s ease, transform .25s ease;
}

/* Checkbox */
.check-btn {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.25);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .18s, background .18s;
  position: relative;
}
.check-btn:hover { border-color: var(--accent); }

.check-btn.checked {
  background: var(--accent);
  border-color: var(--accent);
}

.check-btn svg {
  width: 13px; height: 13px;
  stroke: #0f2952;
  stroke-width: 2.8;
  opacity: 0;
  transform: scale(0.5);
  transition: opacity .18s, transform .18s;
}
.check-btn.checked svg { opacity: 1; transform: scale(1); }

/* Task text */
.task-text-wrap { flex: 1; min-width: 0; }

.task-text {
  font-size: 0.92rem;
  line-height: 1.45;
  color: var(--text);
  word-break: break-word;
  transition: color .2s;
  outline: none;
  cursor: text;
}

.task-card.done .task-text {
  color: var(--text-done);
  text-decoration: line-through;
  text-decoration-color: rgba(255,255,255,0.20);
}

.task-meta {
  font-size: 0.7rem;
  color: var(--text-dim);
  margin-top: 2px;
}

/* Delete btn */
.del-btn {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--text-dim);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity .15s, background .15s, color .15s;
}
.task-card:hover .del-btn { opacity: 1; }
.del-btn:hover { background: rgba(255,80,80,0.15); color: #ff6b6b; }
.del-btn svg { width: 15px; height: 15px; }

/* Empty state */
.empty {
  text-align: center;
  padding: 3.5rem 1rem;
  color: var(--text-dim);
}
.empty-icon {
  font-size: 2.8rem;
  margin-bottom: 0.75rem;
  display: block;
}
.empty strong { color: var(--text); display: block; font-size: 1rem; margin-bottom: 0.25rem; font-weight: 500; }
.empty p { font-size: 0.84rem; line-height: 1.6; }

/* Clear completed */
.clear-row {
  display: flex;
  justify-content: flex-end;
  margin-top: 1.25rem;
}
.clear-btn {
  background: transparent;
  border: none;
  font-family: 'Instrument Sans', sans-serif;
  font-size: 0.78rem;
  color: var(--text-dim);
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
  transition: color .15s, background .15s;
}
.clear-btn:hover { color: #ff6b6b; background: rgba(255,80,80,0.10); }

/* Responsive */
@media (max-width: 400px) {
  .app { padding: 2rem 1rem 2rem; }
  .logo { font-size: 1.9rem; }
}
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <h1 class="logo">Clar<em>ity</em></h1>
    <p class="tagline">Your tasks, beautifully managed</p>
    <div class="progress-wrap">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <span class="progress-label" id="progressLabel">0 / 0 done</span>
    </div>
  </header>

  <div class="add-row">
    <input class="add-input" type="text" id="taskInput"
      placeholder="Add a new task…" maxlength="200" autocomplete="off">
    <button class="add-btn" id="addBtn" aria-label="Add task">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="done">Completed</button>
  </div>

  <ul class="task-list" id="taskList" aria-label="Tasks"></ul>

  <div class="clear-row">
    <button class="clear-btn" id="clearBtn">Clear completed</button>
  </div>

</div>

<script>
  const STORE_KEY = 'clarity_tasks';
  let tasks = [];
  let filter = 'all';

  const taskInput = document.getElementById('taskInput');
  const addBtn    = document.getElementById('addBtn');
  const taskList  = document.getElementById('taskList');
  const clearBtn  = document.getElementById('clearBtn');
  const progressFill  = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');

  // Load
  try { tasks = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { tasks = []; }

  function save() {
    localStorage.setItem(STORE_KEY, JSON.stringify(tasks));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function relativeDate(ts) {
    const diff = Date.now() - ts;
    const m = Math.floor(diff / 60000);
    if (m < 1)  return 'just now';
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    const d = Math.floor(h / 24);
    return d === 1 ? 'yesterday' : `${d}d ago`;
  }

  function addTask() {
    const text = taskInput.value.trim();
    if (!text) { taskInput.focus(); return; }
    const task = { id: uid(), text, done: false, created: Date.now() };
    tasks.unshift(task);
    save();
    taskInput.value = '';
    render();
    taskInput.focus();
  }

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function deleteTask(id) {
    const card = document.querySelector(`[data-id="${id}"]`);
    if (card) {
      card.classList.add('removing');
      setTimeout(() => {
        tasks = tasks.filter(t => t.id !== id);
        save(); render();
      }, 260);
    }
  }

  function clearDone() {
    const doneCards = document.querySelectorAll('.task-card.done');
    doneCards.forEach(c => c.classList.add('removing'));
    setTimeout(() => {
      tasks = tasks.filter(t => !t.done);
      save(); render();
    }, 280);
  }

  function getFiltered() {
    if (filter === 'active') return tasks.filter(t => !t.done);
    if (filter === 'done')   return tasks.filter(t => t.done);
    return tasks;
  }

  function render() {
    const filtered = getFiltered();
    const total = tasks.length;
    const doneCount = tasks.filter(t => t.done).length;
    const pct = total ? Math.round((doneCount / total) * 100) : 0;
    progressFill.style.width = pct + '%';
    progressLabel.textContent = `${doneCount} / ${total} done`;

    taskList.innerHTML = '';

    if (filtered.length === 0) {
      const emptyMsgs = {
        all:    { icon: '✨', title: 'All clear!', body: 'Add your first task above to get started.' },
        active: { icon: '🎉', title: 'Nothing left to do!', body: 'All tasks are completed.' },
        done:   { icon: '📋', title: 'No completed tasks yet', body: 'Check off some tasks to see them here.' },
      };
      const m = emptyMsgs[filter];
      taskList.innerHTML = `
        <li>
          <div class="empty">
            <span class="empty-icon">${m.icon}</span>
            <strong>${m.title}</strong>
            <p>${m.body}</p>
          </div>
        </li>`;
      return;
    }

    filtered.forEach(task => {
      const li = document.createElement('li');
      li.innerHTML = `
        <div class="task-card${task.done ? ' done' : ''}" data-id="${task.id}">
          <button class="check-btn${task.done ? ' checked' : ''}"
            aria-label="${task.done ? 'Mark incomplete' : 'Mark complete'}"
            onclick="toggleTask('${task.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </button>
          <div class="task-text-wrap">
            <div class="task-text">${escHtml(task.text)}</div>
            <div class="task-meta">${relativeDate(task.created)}</div>
          </div>
          <button class="del-btn" aria-label="Delete task" onclick="deleteTask('${task.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4h6v2"/>
            </svg>
          </button>
        </div>`;
      taskList.appendChild(li);
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Events
  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
  clearBtn.addEventListener('click', clearDone);

  document.getElementById('filters').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    filter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });

  // Seed tasks on first visit
  if (tasks.length === 0) {
    tasks = [
      { id: uid(), text: 'Buy groceries for the week', done: false, created: Date.now() - 3600000 },
      { id: uid(), text: 'Read 20 pages of a book', done: true,  created: Date.now() - 7200000 },
      { id: uid(), text: 'Go for a morning run', done: false, created: Date.now() - 1800000 },
    ];
    save();
  }

  render();
</script>
</body>
</html>
